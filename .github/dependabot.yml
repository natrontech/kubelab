version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    commit-message:
      prefix: "chore"

updates:
  - package-ecosystem: "npm"
    directory: "kubelab-ui/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "kubelab-backend/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 7
