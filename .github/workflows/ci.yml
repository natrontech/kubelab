name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  go-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubelab-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: kubelab-backend/go.mod
          cache-dependency-path: kubelab-backend/go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  ui-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubelab-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: kubelab-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Install browser for regression test
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
